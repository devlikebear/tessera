run:
  id: novel-team-run
  workers: 3
  max_attempts: 2
  role_limits:
    researcher: 1
    leader: 1
    writer: 2
    editor: 1

queue:
  type: inmemory
  lease_timeout: 30s

llm:
  default_provider: claude
  providers:
    claude:
      provider: anthropic
      model: claude-sonnet-4
      api_key_env: ANTHROPIC_API_KEY
      max_tokens: 4096
      reasoning_effort: medium

    codex:
      provider: openai-codex
      model: gpt-5-codex
      auth_mode: oauth
      work_dir: .

roles:
  researcher:
    llm_provider: claude
    max_iterations: 2
  leader:
    llm_provider: claude
    max_iterations: 2
  writer:
    llm_provider: codex
    max_iterations: 4
  editor:
    llm_provider: claude
    max_iterations: 2

observe:
  events_jsonl: .tessera/runs/novel-team/events.jsonl
  report_json: .tessera/runs/novel-team/report.json
  html_report: .tessera/runs/novel-team/report.html
